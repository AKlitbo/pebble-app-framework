<!-- HTML header for doxygen 1.18.0 -->
<!--
  Doxygen's own header for 1.18.0, made with `doxygen -w html header.html footer.html style.css`.
  Two things are changed. The scripts at the end of the head load the site's theme.js, the
  doxygen-awesome dark mode toggle and interactive table of contents, and the fix for Doxygen's
  double escaped outline links. The title area keeps only the line naming this part of the site, to
  match the title TypeDoc shows. Its logo, brief, and search cells are gone, because the site's
  shared bar already shows the logo and the search box is in Doxygen's own menu. Regenerate this file
  the same way when Doxygen moves up a version, then put those two changes back.
-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="$langISO">
<head>
<meta http-equiv="Content-Type" content="text/xhtml;charset=UTF-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=11"/>
<meta name="generator" content="Doxygen $doxygenversion"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!--BEGIN PROJECT_NAME--><title>$projectname: $title</title><!--END PROJECT_NAME-->
<!--BEGIN !PROJECT_NAME--><title>$title</title><!--END !PROJECT_NAME-->
<!--BEGIN PROJECT_ICON-->
<link rel="icon" href="$relpath^$projecticon" type="image/svg+xml" />
<!--END PROJECT_ICON-->
<link href="$relpath^tabs.css" rel="stylesheet" type="text/css"/>
<!--BEGIN FULL_SIDEBAR-->
<meta name="doxygen-page-layout" content="1" />
<!--END FULL_SIDEBAR-->
<!--BEGIN HTML_DYNAMIC_SECTIONS-->
<script type="text/javascript" src="$relpath^dynsections.js"></script>
<!--END HTML_DYNAMIC_SECTIONS-->
<!--BEGIN HTML_CODE_FOLDING-->
<script type="text/javascript" src="$relpath^codefolding.js"></script>
<!--END HTML_CODE_FOLDING-->
<!--BEGIN COPY_CLIPBOARD-->
<script type="text/javascript" src="$relpath^clipboard.js"></script>
<!--END COPY_CLIPBOARD-->
$treeview
$search
$mathjax
$darkmode
$mermaidjs
<link href="$relpath^$stylesheet" rel="stylesheet" type="text/css" />
$extrastylesheet
<!-- the site's light and dark rules. the toggle reads its choice as it loads, so this runs first -->
<script type="text/javascript" src="$relpath^../theme.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-darkmode-toggle.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-interactive-toc.js"></script>
<script type="text/javascript">
  DoxygenAwesomeDarkModeToggle.title = "Switch between light and dark";
  DoxygenAwesomeDarkModeToggle.init();
  DoxygenAwesomeInteractiveToc.init();
</script>
<script type="text/javascript">
  // doxygen 1.18.0 builds the outline panel on the right by running each name through its own
  // escapeHtml and then setting the result as plain text, so a path reads c&#x2F;core&#x2F;clock on
  // the page. this watches for the panel and puts the real characters back in each link, once each.
  // TODO: remove once Doxygen stops double escaping names in navtree.js
  (function () {
    var entities = {
      '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"',
      '&#39;': "'", '&#x2F;': '/', '&#x60;': '`', '&#x3D;': '='
    };

    function unescapeOutline() {
      var panel = document.getElementById('page-nav-contents');
      if (!panel) {
        return;
      }

      panel.querySelectorAll('a:not([data-unescaped])').forEach(function (link) {
        // mark before changing the text, so the change cannot trigger this again
        link.setAttribute('data-unescaped', '');
        link.textContent = link.textContent.replace(
          /&(?:amp|lt|gt|quot|#39|#x2F|#x60|#x3D);/g,
          function (entity) {
            return entities[entity];
          }
        );
      });
    }

    new MutationObserver(unescapeOutline).observe(
      document.documentElement,
      { childList: true, subtree: true }
    );
  })();
</script>
</head>
