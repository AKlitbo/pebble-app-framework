<!-- HTML header for doxygen 1.18.0 -->
<!--
  Doxygen's own header for 1.18.0, made with `doxygen -w html header.html footer.html style.css`.
  The only change is the block of scripts at the end of the head, which adds the doxygen-awesome
  dark mode toggle and interactive table of contents. Regenerate it the same way when Doxygen
  moves up a version, then put that block back.
-->

</script>

<script type="text/javascript">
  // a Pebble screen with nothing lit up is black, so a first visit opens dark whatever the system is
  // set to. the toggle reads its choice as it loads, so this has to run before its script does.
  // once the marker is down, whatever the reader picks with the toggle is left alone
  (function () {
    try {
      if (!localStorage.getItem('pebble-docs-opened')) {
        localStorage.setItem('pebble-docs-opened', 'true');
        if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
          localStorage.setItem('prefers-dark-mode-in-light-mode', 'true');
        }
      }
    } catch (e) {
      // storage is blocked, so the system setting decides
    }
  })();
</script>
<script type="text/javascript" src="$relpath^doxygen-awesome-darkmode-toggle.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-interactive-toc.js"></script>
<script type="text/javascript">
  DoxygenAwesomeDarkModeToggle.title = "Switch between light and dark";
  DoxygenAwesomeDarkModeToggle.init();
  DoxygenAwesomeInteractiveToc.init();
</script>
<script type="text/javascript">
  // doxygen 1.18.0 builds the outline panel on the right by running each name through its own
  // escapeHtml and then setting the result as plain text, so a path reads c&#x2F;core&#x2F;clock on
  // the page. this watches for the panel and puts the real characters back in each link, once each.
  // TODO: remove once Doxygen stops double escaping names in navtree.js
  (function () {
    var entities = {
      '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"',
      '&#39;': "'", '&#x2F;': '/', '&#x60;': '`', '&#x3D;': '='
    };

    function unescapeOutline() {
      var panel = document.getElementById('page-nav-contents');
      if (!panel) {
        return;
      }

      panel.querySelectorAll('a:not([data-unescaped])').forEach(function (link) {
        // mark before changing the text, so the change cannot trigger this again
        link.setAttribute('data-unescaped', '');
        link.textContent = link.textContent.replace(
          /&(?:amp|lt|gt|quot|#39|#x2F|#x60|#x3D);/g,
          function (entity) {
            return entities[entity];
          }
        );
      });
    }

    new MutationObserver(unescapeOutline).observe(
      document.documentElement,
      { childList: true, subtree: true }
    );
  })();
</script>
