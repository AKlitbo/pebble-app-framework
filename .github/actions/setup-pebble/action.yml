name: Setup Pebble
description: >
  Installs Node, pebble-tool, and the Pebble SDK so `paf build` can run, then checks the toolchain answers
  and puts the pebble-tool and SDK versions on the job summary. Given a face that paf sync has already
  filled and installed, it takes the Node, SDK, and pebble-tool that face's framework records. Without
  one, it takes them from the inputs and runs npm ci at the repo root. Linux runners only.

# a face repo's ci.yml and release.yml both run this, since a release built with a different toolchain
# from CI is a release nobody tested

inputs:
  face:
    description: >
      A face that paf sync has already filled and installed. Its framework's toolchain.json names
      the Node major, SDK, and pebble-tool to install, over node-version, sdk-version, and
      pebble-tool-version.
    required: false
    default: ''
  node-version:
    description: >
      The Node version to install when there is no face, or when the face's framework records no Node.
      Empty takes 24. A face's framework that records one wins, and a different major here is named
      in a warning.
    required: false
    default: ''
  sdk-version:
    description: >
      The Pebble SDK to install, such as 4.17. The default, latest, takes whatever is newest on the day,
      so the summary is the only record of which SDK a build used. A pinned version is also cached
      between runs, which latest cannot be, since a cached latest would quietly stop being the latest.
    required: false
    default: latest
  pebble-tool-version:
    description: >
      The pebble-tool to install, such as 5.0.40. Empty takes the newest. With a pinned sdk-version
      that is the newest on the day the cache was made, which later runs keep until the runner image
      changes. A face always pins both.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Read the Face's Toolchain
      id: toolchain
      if: inputs.face != ''
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        FACE: ${{ inputs.face }}
      with:
        # the input reaches the script through the environment, never through this body
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, 'scripts', 'toolchain.js'));
          return run({ core });

    # a face's framework decides its versions. without a face they come from the inputs
    - name: Pick the Versions
      id: versions
      shell: bash
      env:
        FROM_FACE_NODE: ${{ steps.toolchain.outputs.node }}
        FROM_FACE_SDK: ${{ steps.toolchain.outputs.sdk }}
        FROM_FACE_TOOL: ${{ steps.toolchain.outputs.pebble-tool }}
        INPUT_NODE: ${{ inputs.node-version }}
        INPUT_SDK: ${{ inputs.sdk-version }}
        INPUT_TOOL: ${{ inputs.pebble-tool-version }}
      run: |
        # an input the face's framework overrides is named, so a run meant to try another version says why it did not
        if [ -n "$FROM_FACE_SDK" ] && [ "$INPUT_SDK" != "latest" ] && [ "$INPUT_SDK" != "$FROM_FACE_SDK" ]; then
          echo "::warning title=Setup Pebble::sdk-version $INPUT_SDK is ignored, since the face's framework records SDK $FROM_FACE_SDK"
        fi
        if [ -n "$FROM_FACE_TOOL" ] && [ -n "$INPUT_TOOL" ] && [ "$INPUT_TOOL" != "$FROM_FACE_TOOL" ]; then
          echo "::warning title=Setup Pebble::pebble-tool-version $INPUT_TOOL is ignored, since the face's framework records pebble-tool $FROM_FACE_TOOL"
        fi
        # a major is compared only when it is a plain number, since setup-node also takes forms such as
        # lts/* or node that name no major here
        WANT=${FROM_FACE_NODE%%.*}
        ASKED=${INPUT_NODE#v}
        ASKED=${ASKED%%.*}
        if [ -n "$WANT" ] && [[ "$ASKED" =~ ^[0-9]+$ ]] && [ "$ASKED" != "$WANT" ]; then
          echo "::warning title=Setup Pebble::node-version $INPUT_NODE is ignored, since the face's framework records Node $FROM_FACE_NODE"
        fi
        # the unit was installed by paf sync, normally under the Node still on the path, and the build
        # runs on the one the framework records. a native package installed under one major can fail
        # to load on another, so a different major on the path is named. it only warns, so a node that
        # will not answer is skipped rather than failing the step
        if [ -n "$WANT" ] && command -v node > /dev/null; then
          ON_PATH=$(node -p 'process.versions.node.split(".")[0]' 2> /dev/null || true)
          if [[ "$ON_PATH" =~ ^[0-9]+$ ]] && [ "$ON_PATH" != "$WANT" ]; then
            echo "::warning title=Setup Pebble::the Node on the path before this step is $ON_PATH, and the build runs on Node $FROM_FACE_NODE, which the face's framework records. If paf sync installed the unit under Node $ON_PATH, run it under Node $FROM_FACE_NODE instead"
          fi
        fi
        echo "node=${FROM_FACE_NODE:-${INPUT_NODE:-24}}" >> "$GITHUB_OUTPUT"
        echo "sdk=${FROM_FACE_SDK:-$INPUT_SDK}" >> "$GITHUB_OUTPUT"
        echo "pebble-tool=${FROM_FACE_TOOL:-$INPUT_TOOL}" >> "$GITHUB_OUTPUT"

    # a face was installed by paf sync before this, so there is nothing left for an npm cache to speed up
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.versions.outputs.node }}
        cache: ${{ inputs.face == '' && 'npm' || '' }}

    # the pkjs bundle requires @rebble/clay, so a full install is needed
    - name: Install Dependencies
      if: inputs.face == ''
      shell: bash
      run: npm ci

    # the SDK and emulator system libraries, as listed at developer.repebble.com/sdk/
    - name: Install SDK System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0 \
          binutils-arm-none-eabi

    # uv puts pebble on ~/.local/bin, whether it is installed below or comes back from the cache
    - name: Put the Pebble Tools on the Path
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # the cached venvs point at the runner's own python3, so a new runner image or Python has to miss the
    # cache, or every pinned build would restore a pebble with nothing to run on
    - name: Read the Runner Image and Python
      id: runner
      if: steps.versions.outputs.sdk != 'latest'
      shell: bash
      run: |
        echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
        echo "python=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

    # about 1.6 GB once installed, so a pinned SDK is fetched once rather than on every face build
    # uv runs pebble-tool on the system Python where it can, and on one it downloads where it cannot
    # a downloaded one comes back from the cache too, or the restored pebble would have nothing to run on
    # the save is its own step straight after the install, since a cache saved at the end of the job is
    # only kept when the whole job passes, and a face build that fails would download it every time
    - name: Restore pebble-tool and the SDK
      id: cache
      if: steps.versions.outputs.sdk != 'latest'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.local/bin/pebble
          ~/.local/share/uv/tools/pebble-tool
          ~/.local/share/uv/python
          ~/.local/share/pebble-sdk
        key: pebble-sdk-${{ steps.versions.outputs.sdk }}-tool${{ steps.versions.outputs.pebble-tool }}-${{ runner.arch }}-${{ steps.runner.outputs.image }}-python${{ steps.runner.outputs.python }}

    - name: Install pebble-tool and the SDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_VERSION: ${{ steps.versions.outputs.sdk }}
        PEBBLE_TOOL: ${{ steps.versions.outputs.pebble-tool }}
      run: |
        set -euo pipefail
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv tool install "pebble-tool${PEBBLE_TOOL:+==$PEBBLE_TOOL}"
        pebble sdk install "$SDK_VERSION"

    - name: Save pebble-tool and the SDK
      if: steps.versions.outputs.sdk != 'latest' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.local/bin/pebble
          ~/.local/share/uv/tools/pebble-tool
          ~/.local/share/uv/python
          ~/.local/share/pebble-sdk
        key: pebble-sdk-${{ steps.versions.outputs.sdk }}-tool${{ steps.versions.outputs.pebble-tool }}-${{ runner.arch }}-${{ steps.runner.outputs.image }}-python${{ steps.runner.outputs.python }}

    - name: Verify Pebble
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        SDK_VERSION: ${{ steps.versions.outputs.sdk }}
      with:
        # the input reaches the script through the environment, never through this body
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, 'scripts', 'verify-pebble.js'));
          return run({ core, exec });
