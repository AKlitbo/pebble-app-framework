name: Docs Site Publish

# builds the docs site and publishes it to GitHub Pages
# the site is the C docs from Doxygen, the TypeScript docs from TypeDoc, a coverage report for each test
# suite, and a home page that ties them together
# every PR builds it too, so a change that breaks the docs or adds a Doxygen or TypeDoc warning fails
# before it merges. only main publishes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a PR's newer push makes its older build pointless, but a publish in progress is left to finish
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build the C Docs
        uses: ./.github/actions/build-doxygen

      # the TypeScript docs, both coverage reports, and the home page with the pages around it
      - name: Build the Rest of the Site
        uses: ./.github/actions/build-docs-site

      # a PR keeps the built site for a week so it can be looked over before it merges
      - name: Upload the Site for Review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/site/dist
          retention-days: 7

      - name: Upload the Site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  publish:
    name: Publish the Docs to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
