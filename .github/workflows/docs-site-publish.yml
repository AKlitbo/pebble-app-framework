name: Docs Site Publish

# builds the docs site and publishes it to GitHub Pages
# the site is the C docs from Doxygen, the TypeScript docs from TypeDoc, a coverage report for each test
# suite, and a home page that ties them together
# every PR builds it too, so a change that breaks the docs or adds a Doxygen or TypeDoc warning fails
# before it merges
# main and each pushed release tag publish into a folder of their own on the gh-pages branch, main/ or one
# named for the tag, so every release keeps the docs and coverage it shipped with. GitHub Pages serves the
# branch as it stands
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# a PR's newer push makes its older build pointless, but a publish in progress is left to finish
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build the C Docs
        uses: ./.github/actions/build-doxygen

      # the TypeScript docs, both coverage reports, and the home page with the pages around it
      - name: Build the Rest of the Site
        uses: ./.github/actions/build-docs-site

      # the publish job picks the site up from here, and a PR's copy stays a week so it can be looked over
      - name: Upload the Site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/site/dist
          retention-days: 7

  publish:
    name: Publish the Docs to GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # main and a tag can publish at the same moment
    # the action starts a beaten push over on top of the other, so no queue is needed here
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download the Site
        uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: docs/site/dist

      - name: Publish
        uses: ./.github/actions/publish-docs-site
        with:
          folder: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
