name: Engine CI

# the engine's own checks, run on every PR and on main
# each check runs through an action in .github/actions/, which puts each failure on its line in the PR and
# the totals on the job summary
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

# a newer push to the same branch or PR makes the run already going pointless
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c-tests:
    name: Test the Host C Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # gcc and make ship on the runner, so the suite needs nothing installed
      - name: Test
        uses: ./.github/actions/verify-c-tests

  vitest:
    name: Test the TypeScript and the Action Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # the checks over real faces skip here and run in the repos that mount the engine
      - name: Test
        uses: ./.github/actions/verify-vitest

  lint:
    name: Lint the TypeScript and the Action Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        uses: ./.github/actions/verify-eslint

  typecheck:
    name: Typecheck the TypeScript Projects
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # the same projects npm run typecheck checks, run one at a time so one failure cannot hide the rest
      - name: Typecheck
        uses: ./.github/actions/verify-typecheck
        with:
          projects: |
            tsconfig.json
            config/tsconfig.builder.json
            config/tsconfig.tools.json
            config/tsconfig.spec.json
