name: Engine CI

# the engine's own checks, run on every PR and on main
# each check runs through an action in .github/actions/, which puts each failure on its line in the PR and
# the totals on the job summary
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

# a newer push to the same branch or PR makes the run already going pointless
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c-tests:
    name: Test the Host C Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # gcc and make ship on the runner, so the suite needs nothing installed
      - name: Test
        uses: ./.github/actions/verify-c-tests

  vitest:
    name: Test the TypeScript and the Action Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # the checks over real faces skip here and run in the repos that mount the engine
      - name: Test
        uses: ./.github/actions/verify-vitest

      # the docs site tools import packages only the docs install has, so their specs run on their own config
      - name: Install the Docs Packages
        run: npm ci --prefix docs

      - name: Test the Docs Site Tools
        uses: ./.github/actions/verify-vitest
        with:
          config: docs/vitest.config.ts

  lint:
    name: Lint the TypeScript and the Action Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        uses: ./.github/actions/verify-eslint

      # Prettier keeps the docs site's templates, stylesheets, and theme script tidy
      # it sits in the docs package's own install, so a repo of faces never needs it
      - name: Install the Docs Packages
        run: npm ci --prefix docs

      - name: Check the Docs Site Formatting
        run: npm --prefix docs run format:check

      # the engine's own config leaves plain JavaScript out, so the site's browser script is linted here
      - name: Lint the Docs Site Script
        run: npm --prefix docs run lint

  typecheck:
    name: Typecheck the TypeScript Projects
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # docs/tsconfig.json checks code that imports packages only the docs install has
      - name: Install the Docs Packages
        run: npm ci --prefix docs

      # the same projects npm run typecheck and npm run typecheck:docs check, run one at a time so one
      # failure cannot hide the rest
      - name: Typecheck
        uses: ./.github/actions/verify-typecheck
        with:
          projects: |
            tsconfig.json
            config/tsconfig.builder.json
            config/tsconfig.tools.json
            config/tsconfig.spec.json
            docs/tsconfig.json
