name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  # host C unit tests over the c/core maths. no SDK or node needed: gcc and make ship on the
  # runner
  c-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shell: bash for pipefail. the default shell is `bash -e` without it, which would report
      # tee's exit code and let a failing suite pass
      - name: Run C Tests
        shell: bash
        run: make -C c/spec | tee c-tests.log

      # always() so a failing suite still reports its numbers
      - name: C Test Summary
        if: always()
        run: bash tools/ci/report-c-tests.sh c-tests.log

  # the engine's own TypeScript: the providers, the Clay pieces and the build tools against their
  # fixtures. the checks over real faces skip here and run in the repos mounting the engine
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
