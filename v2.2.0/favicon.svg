<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Pebble App Framework">
  <!--
    The same watch shrunk down for the browser tab. The buttons come off and the body fills the
    frame, because at that size the little buttons on the side just turn into fuzz on the edge. The
    three pixels become two so they still read as a row.
  -->
  <rect x="1.5" y="0.5" width="21" height="23" rx="4.4" fill="#ff4700" />
  <rect x="5" y="4.4" width="14" height="15.2" rx="1.6" fill="#f2f0eb" />
  <rect x="7.4" y="14.4" width="3.4" height="3.4" fill="#ff4700" />
  <rect x="13.2" y="14.4" width="3.4" height="3.4" fill="#ff4700" />
</svg>
